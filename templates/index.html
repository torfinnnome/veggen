<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veggen Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <script>
        // Apply saved theme before first paint to avoid a flash of the wrong theme.
        (function () {
            var saved = localStorage.getItem('veggen-theme');
            document.documentElement.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light');
        })();
    </script>
    <style>
        :root { --pico-spacing: 0.5rem; }
        :root[data-theme="light"] {
            --veggen-status-blocked: #d81b60;
            --veggen-status-online: #2e7d32;
            --veggen-pill-border: #d9dce0;
            --veggen-pill-text: #1e293b;
            --veggen-tab-hover: #1e293b;
        }
        :root[data-theme="dark"] {
            --veggen-status-blocked: #f06292;
            --veggen-status-online: #66bb6a;
            --veggen-pill-border: #4a5568;
            --veggen-pill-text: #e2e8f0;
            --veggen-tab-hover: #e2e8f0;
        }
        .status-blocked { color: var(--veggen-status-blocked); font-weight: bold; font-size: 0.85em; }
        .status-online { color: var(--veggen-status-online); font-weight: bold; font-size: 0.85em; }
        .loading { display: none; }
        [aria-busy="true"] .loading { display: inline-block; }
        
        table { margin-bottom: 0; }
        table td, table th { 
            padding: 0.4rem 0.5rem; 
            vertical-align: middle; 
        }
        
        .group-header {
            background-color: var(--pico-accordion-close-summary-color);
            border-top: 2px solid var(--pico-primary);
            border-bottom: 1px solid var(--pico-border-color);
        }
        .group-header td {
            padding-top: 1rem;
            padding-bottom: 1rem;
        }
        /* Add space before group header except the first one */
        #devices-tbody tr.group-header:not(:first-child) td {
            padding-top: 2.5rem;
        }
        .kid-name {
            font-size: 1.25em;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--pico-primary);
            margin: 0;
        }
        .device-row td:first-child {
            padding-left: 1.5rem; /* Indent devices */
        }
        .device-name { font-weight: 600; line-height: 1.2; cursor: pointer; }
        .device-name:hover { color: var(--pico-primary); }
        .device-meta { 
            font-size: 0.75em; 
            color: var(--pico-muted-color); 
            display: block;
            margin-top: -2px;
        }
        
        .batch-control {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            font-size: 0.85em;
            font-weight: 600;
        }
        input[role="switch"] { margin-bottom: 0; }

        .period-pills { display: flex; gap: 6px; margin-bottom: 10px; }
        .period-pill {
            padding: 3px 12px;
            border-radius: 12px;
            border: 1px solid var(--veggen-pill-border);
            background: none;
            color: var(--veggen-pill-text);
            font-size: 11px;
            cursor: pointer;
            margin: 0;
            line-height: normal;
        }
        .period-pill.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
        }
        .detail-stats { display: flex; gap: 16px; margin-bottom: 10px; font-size: 13px; }
        .detail-stats strong { font-weight: 700; }
.period-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 10px;
    font-size: 13px;
}
.period-nav-label {
    min-width: 140px;
    text-align: center;
    font-weight: 600;
    color: var(--pico-color);
}
.period-nav-btn {
    font-size: 0.8em;
    padding: 2px 10px;
    border: 1px solid var(--pico-border-color);
    border-radius: 4px;
    background: var(--pico-background-color);
    color: var(--pico-muted-color);
    cursor: pointer;
    line-height: 1;
    margin: 0;
}
.period-nav-btn:hover:not(:disabled) {
    color: var(--pico-primary);
    border-color: var(--pico-primary);
}
.period-nav-btn:disabled {
    opacity: 0.35;
    cursor: default;
}
        .chart-container { position: relative; height: 200px; width: 100%; }
        .tab-bar {
            display: flex;
            gap: 0;
            border-bottom: 2px solid var(--pico-border-color);
            margin-bottom: 0;
            align-items: center;
        }
        .tab-bar-tabs { display: flex; gap: 0; }
        .search-input-wrap {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .reload-btn {
            border: 1px solid var(--pico-border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1em;
            padding: 2px 8px;
            line-height: 1;
        }
        .reload-btn:hover {
            color: var(--pico-primary);
            border-color: var(--pico-primary);
        }
        .search-input {
            border: 1px solid var(--pico-border-color);
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 0.8em;
            background: var(--pico-background-color);
            color: var(--pico-color);
            outline: none;
            width: 160px;
            margin-bottom: 0;
            height: auto;
        }
        .search-input:focus {
            border-color: var(--pico-primary);
            box-shadow: 0 0 0 2px var(--pico-primary-background);
        }
        .tab-btn {
            padding: 0.5rem 1rem;
            border: none;
            background: none;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            color: var(--pico-muted-color);
        }
        .tab-btn:hover { color: var(--veggen-tab-hover); }
        .tab-btn.active {
            color: var(--pico-primary);
            border-bottom-color: var(--pico-primary);
        }
        .period-select {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            padding: 0.25rem 0.5rem;
            width: auto;
        }
        .traffic-cell, .traffic-down, .traffic-up {
            font-size: 10px;
            white-space: nowrap;
            color: var(--pico-muted-color);
        }
        .sortable-header {
            cursor: pointer;
            user-select: none;
        }
        .sortable-header:hover {
            color: var(--pico-primary);
        }
        .sortable-header.active-sort {
            background: var(--pico-primary-background);
            font-weight: 700;
        }
        .zoom-controls {
            display: flex;
            gap: 2px;
            justify-content: flex-end;
            margin-top: 4px;
        }
        .zoom-btn {
            font-size: 0.8em;
            padding: 2px 8px;
            border: 1px solid var(--pico-border-color);
            border-radius: 4px;
            background: var(--pico-background-color);
            color: var(--pico-muted-color);
            cursor: pointer;
            line-height: 1;
            margin: 0;
        }
        .zoom-btn:hover {
            color: var(--pico-primary);
            border-color: var(--pico-primary);
        }
    </style>
</head>
<body>
    <nav class="container">
        <ul><li><strong>Veggen</strong></li></ul>
        <ul>
            <li><button id="theme-toggle" class="secondary" style="font-size: 0.8em; margin: 0;" onclick="toggleTheme()">Dark</button></li>
            <li><a href="/logout" class="secondary" style="font-size: 0.8em;">Logout</a></li>
        </ul>
    </nav>
    <main class="container">
        <section id="device-list" aria-busy="true">
            <select id="period-select" class="period-select" onchange="onPeriodChange()">
                <option value="day">Day</option>
                <option value="week">Week</option>
                <option value="month">Month</option>
                <option value="year">Year</option>
            </select>
            <div class="tab-bar">
                <div class="tab-bar-tabs">
                    <button class="tab-btn active" onclick="switchTab('managed')">Managed</button>
                    <button class="tab-btn" onclick="switchTab('allhosts')">All Hosts</button>
                    <button class="tab-btn" onclick="switchTab('interfaces')">Interfaces</button>
                </div>
                <div class="search-input-wrap">
                    <input type="text" class="search-input" id="search-input" placeholder="Search devices..." oninput="filterDevices()">
                    <span class="reload-btn" onclick="reloadAll()" title="Reload data">&#x21bb;</span>
                </div>
            </div>
            <div id="managed-tab">
                <div class="loading">Loading...</div>
                <table id="main-table">
                    <thead>
                        <tr>
                            <th>Device</th>
                            <th style="width: 130px;">Traffic ↓</th>
                            <th style="width: 130px;">Traffic ↑</th>
                            <th style="width: 100px;">Status</th>
                            <th style="width: 60px;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="devices-tbody"></tbody>
                </table>
            </div>
            <div id="allhosts-tab" style="display:none;">
                <table id="allhosts-table">
                    <thead>
                        <tr>
                            <th class="sortable-header" onclick="sortAllHostsCol(0)">Device</th>
                            <th class="sortable-header" style="width: 140px;" onclick="sortAllHostsCol(1)">IP</th>
                            <th class="sortable-header" style="width: 160px;" onclick="sortAllHostsCol(2)">MAC</th>
                            <th class="sortable-header" style="width: 130px;" onclick="sortAllHostsCol(3)">Traffic ↓</th>
                            <th class="sortable-header" style="width: 130px;" onclick="sortAllHostsCol(4)">Traffic ↑</th>
                        </tr>
                    </thead>
                    <tbody id="allhosts-tbody">
                        <tr><td colspan="5">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
            <div id="interfaces-tab" style="display:none;">
                <table id="interfaces-table">
                    <thead>
                        <tr>
                            <th class="sortable-header" onclick="sortInterfacesCol(0)">Name</th>
                            <th class="sortable-header" style="width: 160px;" onclick="sortInterfacesCol(1)">MAC</th>
                            <th class="sortable-header" style="width: 130px;" onclick="sortInterfacesCol(2)">Traffic ↓</th>
                            <th class="sortable-header" style="width: 130px;" onclick="sortInterfacesCol(3)">Traffic ↑</th>
                        </tr>
                    </thead>
                    <tbody id="interfaces-tbody">
                        <tr><td colspan="4">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        var _detailCache = {};
        var _charts = {};
        // Per-host period-navigation state: period = day|week|month|year,
        // offset = 0 (current period, clamped to now) or N periods back.
        var _detailPeriod = {};
        var _detailOffset = {};
        var _MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

        // Compute the [start, end) epoch-second window for (period, offset)
        // in the browser's local time, so "today" aligns to the user's
        // midnight — not the router's UTC-internal clock. Week starts Monday.
        function _periodWindow(period, offset) {
            var now = new Date();
            var start, end;
            if (period === 'day') {
                var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - offset);
                start = new Date(d.getFullYear(), d.getMonth(), d.getDate());
                if (offset === 0) { end = now; } else { end = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1); }
            } else if (period === 'week') {
                // Monday-start: JS getDay() is 0=Sun..6=Sat; shift so Mon=0.
                var dow = (now.getDay() + 6) % 7;
                var monThis = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow);
                var mon = new Date(monThis.getFullYear(), monThis.getMonth(), monThis.getDate() - 7 * offset);
                start = mon;
                if (offset === 0) { end = now; } else { end = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 7); }
            } else if (period === 'month') {
                var m = now.getMonth() - offset;
                var y = now.getFullYear();
                while (m < 0) { m += 12; y -= 1; }
                start = new Date(y, m, 1);
                if (offset === 0) { end = now; } else { end = new Date(y, m + 1, 1); }
            } else { // year
                var yy = now.getFullYear() - offset;
                start = new Date(yy, 0, 1);
                if (offset === 0) { end = now; } else { end = new Date(yy + 1, 0, 1); }
            }
            return { start: Math.floor(start.getTime() / 1000), end: Math.floor(end.getTime() / 1000) };
        }

        // Human label for the current (period, offset): "Today, 9 Aug", etc.
        function _periodLabel(period, offset) {
            var w = _periodWindow(period, offset);
            var s = new Date(w.start * 1000);
            if (period === 'day') {
                if (offset === 0) return 'Today, ' + s.getDate() + ' ' + _MON[s.getMonth()];
                if (offset === 1) return 'Yesterday, ' + s.getDate() + ' ' + _MON[s.getMonth()];
                return s.getDate() + ' ' + _MON[s.getMonth()];
            }
            if (period === 'week') {
                var e = new Date((w.end - 1) * 1000);
                return 'Week of ' + s.getDate() + ' ' + _MON[s.getMonth()]
                    + ' – ' + e.getDate() + ' ' + _MON[e.getMonth()];
            }
            if (period === 'month') {
                var label = _MON[s.getMonth()];
                if (s.getFullYear() !== new Date().getFullYear()) label += ' ' + s.getFullYear();
                return label;
            }
            return String(s.getFullYear());
        }


        function _isDark() {
            return document.documentElement.getAttribute('data-theme') === 'dark';
        }

        function _chartColors() {
            if (_isDark()) {
                return {
                    down: '#64b5f6',
                    downFill: 'rgba(100,181,246,0.25)',
                    up: '#ef9a9a',
                    upFill: 'rgba(239,154,154,0.25)',
                    grid: 'rgba(255,255,255,0.1)',
                    tick: '#9ca3af'
                };
            }
            return {
                down: '#1565c0',
                downFill: 'rgba(21,101,192,0.35)',
                up: '#c62828',
                upFill: 'rgba(198,40,40,0.35)',
                grid: 'rgba(0,0,0,0.1)',
                tick: '#6b7280'
            };
        }

        function updateThemeButton() {
            var btn = document.getElementById('theme-toggle');
            if (btn) btn.textContent = _isDark() ? 'Light' : 'Dark';
        }

        function toggleTheme() {
            var html = document.documentElement;
            var theme = _isDark() ? 'light' : 'dark';
            html.setAttribute('data-theme', theme);
            localStorage.setItem('veggen-theme', theme);
            updateThemeButton();
            // Re-render all open charts so grid/tick colors match the new theme.
            document.querySelectorAll('.detail-row[data-expanded="true"]').forEach(function (det) {
                var mac = det.getAttribute('data-mac');
                var data = _detailCache[mac];
                if (data && data.period) _renderDetail(mac, data, data.period, _detailOffset[mac] || 0);
            });
        }

        function _formatBytes(b) {
            if (b === 0) return '0 B';
            var k = 1024;
            var sizes = ['B','KB','MB','GB','TB'];
            var i = Math.floor(Math.log(b) / Math.log(k));
            return parseFloat((b / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function _createDetailRow(mac) {
            var row = document.createElement('tr');
            row.className = 'detail-row';
            row.setAttribute('data-mac', mac);
            row.setAttribute('data-expanded', 'false');
            row.style.display = 'none';
            var td = document.createElement('td');
            td.style.padding = '14px 14px 14px 34px';
            row.appendChild(td);
            return row;
        }

        async function _fetchHistory(mac, period, start, end) {
            try {
                var res = await fetch('/api/traffic/history?mac=' + mac + '&period=' + period + '&start=' + start + '&end=' + end);
                var data = await res.json();
                _detailCache[mac] = data;
                return data;
            } catch (e) {
                console.error('Error fetching history:', e);
                return null;
            }
        }

        function toggleDetail(dev) {
            var mac = dev.mac;
            var det = document.querySelector('.detail-row[data-mac="' + mac + '"]');
            if (!det || det.getAttribute('data-expanded') === 'false') {
                if (!det) {
                    var parentTr = dev._parentTr ||
                        document.querySelector('[data-mac="' + mac + '"]')?.closest('tr');
                    if (!parentTr) return;
                    det = _createDetailRow(mac);
                    var colspan = parentTr.parentNode.querySelectorAll('tr:first-child th, tr:first-child td').length || 5;
                    det.querySelector('td').setAttribute('colspan', colspan);
                    parentTr.parentNode.insertBefore(det, parentTr.nextSibling);
                }
                det.style.display = '';
                det.setAttribute('data-expanded', 'true');
                (async function () {
                    _detailPeriod[mac] = _detailPeriod[mac] || 'day';
                    _detailOffset[mac] = _detailOffset[mac] || 0;
                    var period = _detailPeriod[mac];
                    var w = _periodWindow(period, _detailOffset[mac]);
                    var data = await _fetchHistory(mac, period, w.start, w.end);
                    _renderDetail(mac, data || {}, period, _detailOffset[mac]);
                })();
            } else if (det) {
                det.style.display = 'none';
                det.setAttribute('data-expanded', 'false');
                if (_charts[mac]) { _charts[mac].destroy(); delete _charts[mac]; }
            }
        }

        function _renderDetail(mac, data, period, offset) {
            var det = document.querySelector('.detail-row[data-mac="' + mac + '"]');
            if (!det) return;
            var td = det.querySelector('td');
            td.innerHTML = '';
            var container = document.createElement('div');
            var pillsDiv = document.createElement('div');
            pillsDiv.className = 'period-pills';
            var periods = ['day', 'week', 'month', 'year'];
            for (var pi = 0; pi < periods.length; pi++) {
                (function (p) {
                    var pill = document.createElement('span');
                    pill.className = 'period-pill' + (p === period ? ' active' : '');
                    pill.setAttribute('role', 'button');
                    pill.textContent = p.charAt(0).toUpperCase() + p.slice(1);
                    pill.addEventListener('click', function () {
                        pillsDiv.querySelectorAll('.period-pill').forEach(function (el) { el.classList.remove('active'); });
                        pill.classList.add('active');
                        _detailPeriod[mac] = p;
                        _detailOffset[mac] = 0;
                        _detailCache[mac] = null;
                        (async function () {
                            var w = _periodWindow(p, 0);
                            var d = await _fetchHistory(mac, p, w.start, w.end);
                            if (d) _renderDetail(mac, d, p, 0);
                        })();
                    });
                    pillsDiv.appendChild(pill);
                })(periods[pi]);
            }
            container.appendChild(pillsDiv);
            // Prev/next navigation between periods (days/weeks/months/years).
            var navDiv = document.createElement('div');
            navDiv.className = 'period-nav';
            var prevBtn = document.createElement('button');
            prevBtn.className = 'period-nav-btn';
            prevBtn.textContent = '\u2039';
            prevBtn.title = 'Previous ' + period;
            prevBtn.onclick = function () {
                var p = _detailPeriod[mac];
                _detailOffset[mac] = (_detailOffset[mac] || 0) + 1;
                var o = _detailOffset[mac];
                _detailCache[mac] = null;
                (async function () {
                    var w = _periodWindow(p, o);
                    var d = await _fetchHistory(mac, p, w.start, w.end);
                    if (d) _renderDetail(mac, d, p, o);
                })();
            };
            navDiv.appendChild(prevBtn);
            var labelEl = document.createElement('span');
            labelEl.className = 'period-nav-label';
            labelEl.textContent = _periodLabel(period, offset || 0);
            navDiv.appendChild(labelEl);
            var nextBtn = document.createElement('button');
            nextBtn.className = 'period-nav-btn';
            nextBtn.textContent = '\u203a';
            nextBtn.title = 'Next ' + period;
            if (!offset || offset <= 0) nextBtn.disabled = true;
            nextBtn.onclick = function () {
                var p = _detailPeriod[mac];
                _detailOffset[mac] = Math.max(0, (_detailOffset[mac] || 0) - 1);
                var o = _detailOffset[mac];
                _detailCache[mac] = null;
                (async function () {
                    var w = _periodWindow(p, o);
                    var d = await _fetchHistory(mac, p, w.start, w.end);
                    if (d) _renderDetail(mac, d, p, o);
                })();
            };
            navDiv.appendChild(nextBtn);
            container.appendChild(navDiv);
            var statsDiv = document.createElement('div');
            statsDiv.className = 'detail-stats';
            var downL = document.createElement('span');
            downL.innerHTML = '\u2193 <strong>' + _formatBytes(data.total_down || 0) + '</strong>';
            statsDiv.appendChild(downL);
            var upL = document.createElement('span');
            upL.innerHTML = '\u2191 <strong>' + _formatBytes(data.total_up || 0) + '</strong>';
            statsDiv.appendChild(upL);
            var avgD = document.createElement('span');
            avgD.textContent = '\u2193 avg ' + _formatBytes(data.avg_down_per_day || 0) + '/day';
            statsDiv.appendChild(avgD);
            var avgU = document.createElement('span');
            avgU.textContent = '\u2191 avg ' + _formatBytes(data.avg_up_per_day || 0) + '/day';
            statsDiv.appendChild(avgU);
            container.appendChild(statsDiv);
            var cw = document.createElement('div');
            cw.className = 'chart-container';
            var canvas = document.createElement('canvas');
            cw.appendChild(canvas);
            container.appendChild(cw);
            var zoomControls = document.createElement('div');
            zoomControls.className = 'zoom-controls';
            var zoomInBtn = document.createElement('button');
            zoomInBtn.className = 'zoom-btn';
            zoomInBtn.textContent = '+';
            zoomInBtn.onclick = function () {
                var ch = _charts[mac];
                if (ch) { ch.zoom(0.8); }
            };
            zoomControls.appendChild(zoomInBtn);
            var zoomOutBtn = document.createElement('button');
            zoomOutBtn.className = 'zoom-btn';
            zoomOutBtn.textContent = '\u2212';
            zoomOutBtn.onclick = function () {
                var ch = _charts[mac];
                if (ch) { ch.zoom(1.25); }
            };
            zoomControls.appendChild(zoomOutBtn);
            var zoomResetBtn = document.createElement('button');
            zoomResetBtn.className = 'zoom-btn';
            zoomResetBtn.textContent = '\u21bb';
            zoomResetBtn.title = 'Reset zoom';
            zoomResetBtn.onclick = function () {
                var ch = _charts[mac];
                if (ch) { ch.resetZoom(); }
            };
            zoomControls.appendChild(zoomResetBtn);
            container.appendChild(zoomControls);
            td.appendChild(container);

            // Destroy previous chart for this MAC (not global)
            if (_charts[mac]) { _charts[mac].destroy(); delete _charts[mac]; }
            if (!data.buckets || data.buckets.length === 0) return;

            var labels = data.buckets.map(function (bk) {
                var d = new Date(bk.ts * 1000);
                if (period === 'day') {
                    var h = d.getHours();
                    var m = d.getMinutes();
                    return h + ':' + (m < 10 ? '0' : '') + m;
                }
                if (period === 'year') {
                    var oneJan = new Date(d.getFullYear(), 0, 1);
                    var weekNum = Math.ceil(((d - oneJan) / 86400000 + oneJan.getDay() + 1) / 7);
                    return _MON[d.getMonth()] + ' ' + weekNum;
                }
                return _MON[d.getMonth()] + ' ' + d.getDate();
            });

            var colors = _chartColors();
            var chartType, downDataset, upDataset, xTicksMaxRotation, yTickCallback;

            if (period === 'day') {
                // Diverging bar chart — Mbps per 15-min bucket
                chartType = 'bar';
                xTicksMaxRotation = 0;
                yTickCallback = function (v) {
                    var av = Math.abs(v);
                    if (av >= 1) return av.toFixed(1) + ' Mbps';
                    var kbps = av * 1000;
                    if (kbps >= 1) return kbps.toFixed(0) + ' kbps';
                    return (kbps * 1000).toFixed(0) + ' bps';
                };
                downDataset = {
                    label: 'Down',
                    data: data.buckets.map(function (bk) { return bk.down_mbps; }),
                    backgroundColor: colors.down,
                    borderRadius: 2,
                    borderSkipped: false
                };
                upDataset = {
                    label: 'Up',
                    data: data.buckets.map(function (bk) { return -bk.up_mbps; }),
                    backgroundColor: colors.up,
                    borderRadius: 2,
                    borderSkipped: false
                };
            } else if (period === 'week' || period === 'month') {
                // Diverging bar chart — MB per day
                chartType = 'bar';
                xTicksMaxRotation = period === 'week' ? 0 : 45;
                yTickCallback = function (v) {
                    var av = Math.abs(v);
                    if (av >= 1024) return (av / 1024).toFixed(1) + ' GB';
                    return av.toFixed(0) + ' MB';
                };
                downDataset = {
                    label: 'Down',
                    data: data.buckets.map(function (bk) { return bk.down / (1024 * 1024); }),
                    backgroundColor: colors.down,
                    borderRadius: 2,
                    borderSkipped: false
                };
                upDataset = {
                    label: 'Up',
                    data: data.buckets.map(function (bk) { return -(bk.up / (1024 * 1024)); }),
                    backgroundColor: colors.up,
                    borderRadius: 2,
                    borderSkipped: false
                };
            } else {
                // Year: diverging bar chart — GB per week
                chartType = 'bar';
                xTicksMaxRotation = 0;
                yTickCallback = function (v) {
                    var av = Math.abs(v);
                    return av.toFixed(1) + ' GB';
                };
                downDataset = {
                    label: 'Down',
                    data: data.buckets.map(function (bk) { return bk.down / (1024 * 1024 * 1024); }),
                    backgroundColor: colors.down,
                    borderRadius: 2,
                    borderSkipped: false
                };
                upDataset = {
                    label: 'Up',
                    data: data.buckets.map(function (bk) { return -(bk.up / (1024 * 1024 * 1024)); }),
                    backgroundColor: colors.up,
                    borderRadius: 2,
                    borderSkipped: false
                };
            }

            _charts[mac] = new Chart(canvas, {
                type: chartType,
                data: {
                    labels: labels,
                    datasets: [downDataset, upDataset]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        zoom: {
                            zoom: {
                                drag: {
                                    enabled: true,
                                    threshold: 10,
                                    backgroundColor: 'rgba(37, 99, 235, 0.12)',
                                    borderColor: 'rgba(37, 99, 235, 0.5)',
                                    borderWidth: 1
                                },
                                wheel: {
                                    enabled: true,
                                    modifierKey: 'shift'
                                },
                                mode: 'x',
                                limit: { maxRange: { x: 10 } }
                            },
                            pan: {
                                enabled: true,
                                mode: 'x',
                                modifierKey: 'shift'
                            },
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: {
                                color: colors.tick,
                                maxRotation: xTicksMaxRotation,
                                autoSkip: true,
                                maxTicksLimit: period === 'day' ? 12 : (period === 'month' ? 10 : 20)
                            }
                        },
                        y: {
                            beginAtZero: true,
                            grid: { color: colors.grid },
                            ticks: {
                                color: colors.tick,
                                callback: yTickCallback
                            }
                        }
                    }
                }
            });
        }

        var _batchTraffic = {};
        var _currentPeriod = 'day';
        var _allHostsSort = { col: -1, dir: 'desc' };

        function onPeriodChange() {
            _currentPeriod = document.getElementById('period-select').value;
            fetchBatchTraffic();
        }

        async function fetchBatchTraffic() {
            // Batch columns use the current period at offset 0 (clamped to
            // now), so Day means since local midnight, not the last 24h.
            var w = _periodWindow(_currentPeriod, 0);
            try {
                var res = await fetch('/api/traffic/batch-history?period=' + _currentPeriod + '&start=' + w.start + '&end=' + w.end);
                var data = await res.json();
                _batchTraffic = data.macs || {};
                updateTrafficCells();
            } catch (e) {
                console.error('Error fetching batch traffic:', e);
            }
        }

        function updateTrafficCells() {
            document.querySelectorAll('.traffic-down[data-mac]').forEach(function(el) {
                var mac = el.getAttribute('data-mac').toLowerCase();
                var t = _batchTraffic[mac];
                el.textContent = (t && t.down > 0) ? _formatBytes(t.down) : '';
            });
            document.querySelectorAll('.traffic-up[data-mac]').forEach(function(el) {
                var mac = el.getAttribute('data-mac').toLowerCase();
                var t = _batchTraffic[mac];
                el.textContent = (t && t.up > 0) ? _formatBytes(t.up) : '';
            });
            sortAllHosts();
            if (document.getElementById('interfaces-tab').style.display !== 'none') sortInterfaces();
        }

        function sortAllHostsCol(col) {
            if (_allHostsSort.col === col) {
                if (_allHostsSort.dir === 'desc') _allHostsSort.dir = 'asc';
                else { _allHostsSort.col = -1; _allHostsSort.dir = 'desc'; }
            } else {
                _allHostsSort.col = col;
                _allHostsSort.dir = 'desc';
            }
            sortAllHosts();
        }

        function _naturalCompare(a, b) {
            if (a === b) return 0;
            var xA = a.split(/(\d+)/).filter(Boolean);
            var xB = b.split(/(\d+)/).filter(Boolean);
            var len = Math.min(xA.length, xB.length);
            for (var i = 0; i < len; i++) {
                var sA = xA[i], sB = xB[i];
                if (sA === sB) continue;
                var nA = parseInt(sA, 10), nB = parseInt(sB, 10);
                if (!isNaN(nA) && !isNaN(nB)) {
                    if (nA !== nB) return nA - nB;
                }
                return sA < sB ? -1 : 1;
            }
            return xA.length - xB.length;
        }

        function sortAllHosts() {
            var tbody = document.getElementById('allhosts-tbody');
            if (!tbody) return;
            var rows = Array.from(tbody.querySelectorAll('tr.device-row'));
            if (rows.length === 0) return;
            var col = _allHostsSort.col;
            var dir = _allHostsSort.dir;
            rows.sort(function(a, b) {
                var macA = a.querySelector('td:nth-child(3)')?.textContent || '';
                var macB = b.querySelector('td:nth-child(3)')?.textContent || '';
                var aVal, bVal;
                if (col === 0) { aVal = a.querySelector('td:nth-child(1)').textContent; bVal = b.querySelector('td:nth-child(1)').textContent; }
                else if (col === 1) { aVal = a.querySelector('td:nth-child(2)').textContent; bVal = b.querySelector('td:nth-child(2)').textContent; }
                else if (col === 2) { aVal = macA; bVal = macB; }
                else if (col === 3) { aVal = _batchTraffic[macA]?.down || 0; bVal = _batchTraffic[macB]?.down || 0; }
                else if (col === 4) { aVal = _batchTraffic[macA]?.up || 0; bVal = _batchTraffic[macB]?.up || 0; }
                else { aVal = a.querySelector('td:nth-child(1)').textContent; bVal = b.querySelector('td:nth-child(1)').textContent; }
                var cmp = 0;
                if (typeof aVal === 'string') cmp = _naturalCompare(aVal, bVal);
                else cmp = aVal - bVal;
                return dir === 'desc' ? -cmp : cmp;
            });
            rows.forEach(function(row) {
                var det = row.nextSibling;
                tbody.appendChild(row);
                if (det && det.className && det.className.indexOf('detail-row') !== -1) {
                    tbody.appendChild(det);
                }
            });
            var headers = tbody.parentNode.querySelectorAll('.sortable-header');
            var baseLabels = ['Device', 'IP', 'MAC', 'Traffic \u2193', 'Traffic \u2191'];
            headers.forEach(function(th, i) {
                th.textContent = baseLabels[i] || th.textContent;
                if (_allHostsSort.col === i) th.classList.add('active-sort');
                else th.classList.remove('active-sort');
            });
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(function(btn) { btn.classList.remove('active'); });
            document.querySelector('.tab-btn[onclick="switchTab(\'' + tab + '\')"]').classList.add('active');
            document.getElementById('managed-tab').style.display = tab === 'managed' ? '' : 'none';
            document.getElementById('allhosts-tab').style.display = tab === 'allhosts' ? '' : 'none';
            document.getElementById('interfaces-tab').style.display = tab === 'interfaces' ? '' : 'none';
            if (tab === 'interfaces') fetchInterfaces();
        }

        async function fetchAllHosts() {
            try {
                var res = await fetch('/api/all-hosts');
                var hosts = await res.json();
                var tbody = document.getElementById('allhosts-tbody');
                tbody.innerHTML = '';
                if (hosts.length === 0) {
                    var row = document.createElement('tr');
                    var cell = document.createElement('td');
cell.setAttribute('colspan', '5');
                    cell.textContent = 'No hosts found.';
                    row.appendChild(cell);
                    tbody.appendChild(row);
                    return;
                }
                hosts.forEach(function(host) {
                    var tr = document.createElement('tr');
                    tr.className = 'device-row';
                    var nameTd = document.createElement('td');
                    nameTd.className = 'device-name';
                    nameTd.setAttribute('data-mac', host.mac);
                    nameTd.textContent = host.name;
                    tr.appendChild(nameTd);
                    var ipTd = document.createElement('td');
                    ipTd.textContent = host.ip;
                    tr.appendChild(ipTd);
                    var macTd = document.createElement('td');
                    macTd.textContent = host.mac;
                    tr.appendChild(macTd);
                    var downTd = document.createElement('td');
                    downTd.className = 'traffic-down';
                    downTd.setAttribute('data-mac', host.mac);
                    tr.appendChild(downTd);
                    var upTd = document.createElement('td');
                    upTd.className = 'traffic-up';
                    upTd.setAttribute('data-mac', host.mac);
                    tr.appendChild(upTd);
                    tbody.appendChild(tr);
                    nameTd.addEventListener('click', function() {
                        toggleDetail({ mac: host.mac, _parentTr: tr });
                    });
                    _detailCache[host.mac] = _detailCache[host.mac] || null;
                });

                sortAllHosts();
            } catch (e) {
                console.error('Error fetching all hosts:', e);
            }
        }

        var _interfaces = [];
        var _interfacesSort = { col: -1, dir: 'desc' };

        async function fetchInterfaces() {
            try {
                var res = await fetch('/api/interfaces');
                _interfaces = await res.json();
                renderInterfaces();
                // Traffic columns: reuse the batch fetch already loaded for all-hosts.
                updateTrafficCells();
            } catch (e) {
                console.error('Error fetching interfaces:', e);
            }
        }

        function renderInterfaces() {
            var tbody = document.getElementById('interfaces-tbody');
            tbody.innerHTML = '';
            if (_interfaces.length === 0) {
                var row = document.createElement('tr');
                var cell = document.createElement('td');
                cell.setAttribute('colspan', '4');
                cell.textContent = 'No interfaces found.';
                row.appendChild(cell);
                tbody.appendChild(row);
                return;
            }
            _interfaces.forEach(function(iface) {
                var tr = document.createElement('tr');
                tr.className = 'device-row';
                var nameTd = document.createElement('td');
                nameTd.className = 'device-name';
                nameTd.setAttribute('data-mac', iface.mac);
                nameTd.textContent = (iface.name && iface.name !== iface.iface) ? iface.name + ' (' + iface.iface + ')' : iface.iface;
                tr.appendChild(nameTd);
                var macTd = document.createElement('td');
                macTd.textContent = iface.mac;
                tr.appendChild(macTd);
                var downTd = document.createElement('td');
                downTd.className = 'traffic-down';
                downTd.setAttribute('data-mac', iface.mac);
                tr.appendChild(downTd);
                var upTd = document.createElement('td');
                upTd.className = 'traffic-up';
                upTd.setAttribute('data-mac', iface.mac);
                tr.appendChild(upTd);
                tbody.appendChild(tr);
                nameTd.addEventListener('click', function() {
                    toggleDetail({ mac: iface.mac, _parentTr: tr });
                });
                _detailCache[iface.mac] = _detailCache[iface.mac] || null;
            });
            sortInterfaces();
        }

        function sortInterfacesCol(col) {
            if (_interfacesSort.col === col) {
                _interfacesSort.dir = _interfacesSort.dir === 'asc' ? 'desc' : 'asc';
            } else {
                _interfacesSort.col = col;
                _interfacesSort.dir = col >= 2 ? 'desc' : 'asc';
            }
            sortInterfaces();
        }

        function sortInterfaces() {
            var tbody = document.getElementById('interfaces-tbody');
            var rows = Array.prototype.slice.call(tbody.querySelectorAll('tr'));
            if (rows.length === 0 || !rows[0].querySelector('.device-name')) return;
            // Detach any open detail rows before sorting.
            var details = {};
            rows.forEach(function(r) {
                var mac = r.querySelector('.device-name') && r.querySelector('.device-name').getAttribute('data-mac');
                var next = r.nextElementSibling;
                if (mac && next && next.className && next.className.indexOf('detail-row') !== -1) {
                    details[mac] = next;
                    next.remove();
                }
            });
            var col = _interfacesSort.col;
            var dir = _interfacesSort.dir === 'asc' ? 1 : -1;
            rows.sort(function(a, b) {
                var va = a.children[col] ? a.children[col].textContent : '';
                var vb = b.children[col] ? b.children[col].textContent : '';
                if (col >= 2) {
                    // Traffic columns: sort by numeric value via the batch map.
                    var ma = a.querySelector('.device-name').getAttribute('data-mac').toLowerCase();
                    var mb = b.querySelector('.device-name').getAttribute('data-mac').toLowerCase();
                    va = (_batchTraffic[ma] && _batchTraffic[ma].down) || 0;
                    vb = (_batchTraffic[mb] && _batchTraffic[mb].down) || 0;
                    if (col === 3) { va = (_batchTraffic[ma] && _batchTraffic[ma].up) || 0; vb = (_batchTraffic[mb] && _batchTraffic[mb].up) || 0; }
                }
                if (va < vb) return -1 * dir;
                if (va > vb) return 1 * dir;
                return 0;
            });
            rows.forEach(function(r) {
                tbody.appendChild(r);
                var mac = r.querySelector('.device-name').getAttribute('data-mac');
                if (details[mac]) tbody.appendChild(details[mac]);
            });
            var headers = tbody.parentNode.querySelectorAll('.sortable-header');
            var baseLabels = ['Name', 'MAC', 'Traffic \u2193', 'Traffic \u2191'];
            headers.forEach(function(th, i) {
                th.textContent = baseLabels[i] || th.textContent;
                if (_interfacesSort.col === i) th.classList.add('active-sort');
                else th.classList.remove('active-sort');
            });
        }


        async function fetchDevices() {
            const section = document.getElementById('device-list');
            section.setAttribute('aria-busy', 'true');
            
            try {
                const response = await fetch('/api/devices');
                const devices = await response.json();
                const tbody = document.getElementById('devices-tbody');
                tbody.innerHTML = '';

                if (devices.length === 0) {
                    const emptyRow = document.createElement('tr');
                    const emptyCell = document.createElement('td');
                    emptyCell.setAttribute('colspan', '5');
                    emptyCell.textContent = 'No devices found.';
                    emptyRow.appendChild(emptyCell);
                    tbody.appendChild(emptyRow);
                    return;
                }

                const groups = devices.reduce((acc, dev) => {
                    if (!acc[dev.kid]) acc[dev.kid] = [];
                    acc[dev.kid].push(dev);
                    return acc;
                }, {});

                for (const kid in groups) {
                    const kidDevices = groups[kid];
                    const allBlocked = kidDevices.every(d => d.blocked);

                    // Group Header Row (DOM-safe, no innerHTML with user data)
                    const headerRow = document.createElement('tr');
                    headerRow.className = 'group-header';

                    const td1 = document.createElement('td');
                    const h3 = document.createElement('h3');
                    h3.className = 'kid-name';
                    h3.textContent = kid;
                    td1.appendChild(h3);
                    headerRow.appendChild(td1);

                    const td2 = document.createElement('td');
                    td2.setAttribute('colspan', '4');

                    const batchDiv = document.createElement('div');
                    batchDiv.className = 'batch-control';

                    const label = document.createElement('span');
                    label.textContent = 'BLOCK ALL';
                    batchDiv.appendChild(label);

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.setAttribute('role', 'switch');
                    if (allBlocked) checkbox.checked = true;
                    checkbox.addEventListener('change', function () {
                        toggleMultiple(kid, this.checked);
                    });
                    batchDiv.appendChild(checkbox);

                    td2.appendChild(batchDiv);
                    headerRow.appendChild(td2);
                    tbody.appendChild(headerRow);

                    // Device Rows (DOM-safe)
                    kidDevices.forEach(dev => {
                        const tr = document.createElement('tr');
                        tr.className = 'device-row';

                        const nameTd = document.createElement('td');
                        const nameDiv = document.createElement('div');
                        nameDiv.className = 'device-name';
                        nameDiv.textContent = dev.device_name;
                        nameTd.appendChild(nameDiv);

                        const metaDiv = document.createElement('div');
                        metaDiv.className = 'device-meta';
                        metaDiv.textContent = dev.ip + ' | ' + dev.mac;
                        nameTd.appendChild(metaDiv);
                        tr.appendChild(nameTd);

                        const downTd = document.createElement('td');
                        downTd.className = 'traffic-down';
                        downTd.setAttribute('data-mac', dev.mac);
                        tr.appendChild(downTd);

                        const upTd = document.createElement('td');
                        upTd.className = 'traffic-up';
                        upTd.setAttribute('data-mac', dev.mac);
                        tr.appendChild(upTd);

                        const statusTd = document.createElement('td');
                        const statusSpan = document.createElement('span');
                        statusSpan.className = dev.blocked ? 'status-blocked' : 'status-online';
                        statusSpan.textContent = dev.blocked ? 'BLOCKED' : 'ONLINE';
                        statusTd.appendChild(statusSpan);
                        tr.appendChild(statusTd);

                        const actionTd = document.createElement('td');
                        const devCheckbox = document.createElement('input');
                        devCheckbox.type = 'checkbox';
                        devCheckbox.setAttribute('role', 'switch');
                        if (dev.blocked) devCheckbox.checked = true;
                        const macVal = dev.mac;
                        const blockedVal = dev.blocked;
                        devCheckbox.addEventListener('change', function () {
                            toggleDevice(macVal, blockedVal);
                        });
                        actionTd.appendChild(devCheckbox);
                        tr.appendChild(actionTd);
                        tbody.appendChild(tr);
                        nameDiv.addEventListener('click', function () {
                            toggleDetail(Object.assign({}, dev, { _parentTr: tr }));
                        });
                        _detailCache[dev.mac] = _detailCache[dev.mac] || null;
                    });
                }
            } catch (error) {
                console.error('Error:', error);
            } finally {
                updateTrafficCells();
                section.setAttribute('aria-busy', 'false');
            }
        }

        async function toggleDevice(mac, currentlyBlocked) {
            const action = currentlyBlocked ? 'unblock' : 'block';
            try {
                const response = await fetch('/api/toggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mac, action })
                });
                if (response.ok) await fetchDevices();
                else alert('Failed to update status.');
            } catch (e) { console.error(e); }
        }

        async function toggleMultiple(kid, shouldBlock) {
            const action = shouldBlock ? 'block' : 'unblock';
            try {
                const res = await fetch('/api/devices');
                const devices = await res.json();
                const macs = devices.filter(d => d.kid === kid).map(d => d.mac);
                if (macs.length === 0) return;

                const response = await fetch('/api/toggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ macs, action })
                });
                if (response.ok) await fetchDevices();
                else alert('Failed to update group.');
            } catch (e) { console.error(e); }
        }

        function filterDevices() {
            var query = document.getElementById('search-input').value.toLowerCase().trim();

            // Filter Managed tab
            var managedTbody = document.getElementById('devices-tbody');
            if (managedTbody) {
                var groupHeaders = managedTbody.querySelectorAll('tr.group-header');
                groupHeaders.forEach(function(header) {
                    var kid = header.querySelector('.kid-name')?.textContent.toLowerCase() || '';
                    var next = header.nextElementSibling;
                    var groupDeviceRows = [];
                    var groupDetailRows = [];
                    while (next && !next.classList.contains('group-header')) {
                        if (next.classList.contains('device-row')) {
                            groupDeviceRows.push(next);
                            var det = next.nextElementSibling;
                            if (det && det.classList.contains('detail-row')) groupDetailRows.push(det);
                        }
                        next = next.nextElementSibling;
                    }
                    var anyVisible = false;
                    groupDeviceRows.forEach(function(row, i) {
                        var name = row.querySelector('.device-name')?.textContent.toLowerCase() || '';
                        var meta = row.querySelector('.device-meta')?.textContent.toLowerCase() || '';
                        var match = !query || name.includes(query) || meta.includes(query) || kid.includes(query);
                        var det = groupDetailRows[i];
                        var detWasOpen = det && det.getAttribute('data-expanded') === 'true';
                        row.style.display = match ? '' : 'none';
                        if (match) anyVisible = true;
                        if (det) det.style.display = (match && detWasOpen) ? '' : 'none';
                    });
                    header.style.display = (!query || kid.includes(query) || anyVisible) ? '' : 'none';
                });
            }

            // Filter All Hosts tab
            var allhostsTbody = document.getElementById('allhosts-tbody');
            if (allhostsTbody) {
                var rows = allhostsTbody.querySelectorAll('tr.device-row');
                rows.forEach(function(row) {
                    var name = row.querySelector('td:nth-child(1)')?.textContent.toLowerCase() || '';
                    var ip = row.querySelector('td:nth-child(2)')?.textContent.toLowerCase() || '';
                    var mac = row.querySelector('td:nth-child(3)')?.textContent.toLowerCase() || '';
                    var match = !query || name.includes(query) || ip.includes(query) || mac.includes(query);
                    row.style.display = match ? '' : 'none';
                    var det = row.nextElementSibling;
                    if (det && det.classList.contains('detail-row')) {
                        var detWasOpen = det.getAttribute('data-expanded') === 'true';
                        det.style.display = (match && detWasOpen) ? '' : 'none';
                    }
                });
            }
        }

        async function reloadAll() {
            var query = document.getElementById('search-input').value;
            _detailCache = {};
            if (_currentChart) { _currentChart.destroy(); _currentChart = null; }
            document.querySelectorAll('.detail-row').forEach(function(det) {
                det.style.display = 'none';
                det.setAttribute('data-expanded', 'false');
            });
            await fetchDevices();
            await fetchAllHosts();
            await fetchInterfaces();
            await fetchBatchTraffic();
            document.getElementById('search-input').value = query;
            filterDevices();
        }

        updateThemeButton();
        fetchDevices();
        fetchAllHosts();
        fetchBatchTraffic();
    </script>
</body>
