<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veggen Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        :root { --pico-spacing: 0.5rem; }
        .status-blocked { color: #d81b60; font-weight: bold; font-size: 0.85em; }
        .status-online { color: #2e7d32; font-weight: bold; font-size: 0.85em; }
        .loading { display: none; }
        [aria-busy="true"] .loading { display: inline-block; }
        
        table { margin-bottom: 0; }
        table td, table th { 
            padding: 0.4rem 0.5rem; 
            vertical-align: middle; 
        }
        
        .group-header {
            background-color: var(--pico-accordion-close-summary-color);
            border-top: 2px solid var(--pico-primary);
            border-bottom: 1px solid var(--pico-border-color);
        }
        .group-header td {
            padding-top: 1rem;
            padding-bottom: 1rem;
        }
        /* Add space before group header except the first one */
        #devices-tbody tr.group-header:not(:first-child) td {
            padding-top: 2.5rem;
        }
        .kid-name {
            font-size: 1.25em;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--pico-primary);
            margin: 0;
        }
        .device-row td:first-child {
            padding-left: 1.5rem; /* Indent devices */
        }
        .device-name { font-weight: 600; line-height: 1.2; cursor: pointer; }
        .device-name:hover { color: var(--pico-primary); }
        .device-meta { 
            font-size: 0.75em; 
            color: var(--pico-muted-color); 
            display: block;
            margin-top: -2px;
        }
        
        .batch-control {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            font-size: 0.85em;
            font-weight: 600;
        }
        input[role="switch"] { margin-bottom: 0; }

        .period-pills { display: flex; gap: 6px; margin-bottom: 10px; }
        .period-pill {
            padding: 3px 12px;
            border-radius: 12px;
            border: 1px solid #d9dce0;
            background: none;
            color: #1e293b;
            font-size: 11px;
            cursor: pointer;
            margin: 0;
            line-height: normal;
        }
        .period-pill.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
        }
        .detail-stats { display: flex; gap: 16px; margin-bottom: 10px; font-size: 13px; }
        .detail-stats strong { font-weight: 700; }
        .chart-container { position: relative; height: 200px; width: 100%; }
        .tab-bar {
            display: flex;
            gap: 0;
            border-bottom: 2px solid var(--pico-border-color);
            margin-bottom: 0;
            align-items: center;
        }
        .tab-bar-tabs { display: flex; gap: 0; }
        .search-input-wrap {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .reload-btn {
            border: 1px solid var(--pico-border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1em;
            padding: 2px 8px;
            line-height: 1;
        }
        .reload-btn:hover {
            color: var(--pico-primary);
            border-color: var(--pico-primary);
        }
        .search-input {
            border: 1px solid var(--pico-border-color);
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 0.8em;
            background: var(--pico-background-color);
            color: var(--pico-color);
            outline: none;
            width: 160px;
            margin-bottom: 0;
            height: auto;
        }
        .search-input:focus {
            border-color: var(--pico-primary);
            box-shadow: 0 0 0 2px var(--pico-primary-background);
        }
        .tab-btn {
            padding: 0.5rem 1rem;
            border: none;
            background: none;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            color: var(--pico-muted-color);
        }
        .tab-btn:hover { color: #1e293b; }
        .tab-btn.active {
            color: var(--pico-primary);
            border-bottom-color: var(--pico-primary);
        }
        .period-select {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            padding: 0.25rem 0.5rem;
            width: auto;
        }
        .traffic-cell, .traffic-down, .traffic-up {
            font-size: 10px;
            white-space: nowrap;
            color: var(--pico-muted-color);
        }
        .sortable-header {
            cursor: pointer;
            user-select: none;
        }
        .sortable-header:hover {
            color: var(--pico-primary);
        }
        .sortable-header.active-sort {
            background: var(--pico-primary-background);
            font-weight: 700;
        }
    </style>
</head>
<body>
    <nav class="container">
        <ul><li><strong>Veggen</strong></li></ul>
        <ul><li><a href="/logout" class="secondary" style="font-size: 0.8em;">Logout</a></li></ul>
    </nav>
    <main class="container">
        <section id="device-list" aria-busy="true">
            <select id="period-select" class="period-select" onchange="onPeriodChange()">
                <option value="day">Day</option>
                <option value="week">Week</option>
                <option value="month">Month</option>
                <option value="year">Year</option>
            </select>
            <div class="tab-bar">
                <div class="tab-bar-tabs">
                    <button class="tab-btn active" onclick="switchTab('managed')">Managed</button>
                    <button class="tab-btn" onclick="switchTab('allhosts')">All Hosts</button>
                </div>
                <div class="search-input-wrap">
                    <input type="text" class="search-input" id="search-input" placeholder="Search devices..." oninput="filterDevices()">
                    <span class="reload-btn" onclick="reloadAll()" title="Reload data">&#x21bb;</span>
                </div>
            </div>
            <div id="managed-tab">
                <div class="loading">Loading...</div>
                <table id="main-table">
                    <thead>
                        <tr>
                            <th>Device</th>
                            <th style="width: 130px;">Traffic ↓</th>
                            <th style="width: 130px;">Traffic ↑</th>
                            <th style="width: 100px;">Status</th>
                            <th style="width: 60px;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="devices-tbody"></tbody>
                </table>
            </div>
            <div id="allhosts-tab" style="display:none;">
                <table id="allhosts-table">
                    <thead>
                        <tr>
                            <th class="sortable-header" onclick="sortAllHostsCol(0)">Device</th>
                            <th class="sortable-header" style="width: 140px;" onclick="sortAllHostsCol(1)">IP</th>
                            <th class="sortable-header" style="width: 160px;" onclick="sortAllHostsCol(2)">MAC</th>
                            <th class="sortable-header" style="width: 130px;" onclick="sortAllHostsCol(3)">Traffic ↓</th>
                            <th class="sortable-header" style="width: 130px;" onclick="sortAllHostsCol(4)">Traffic ↑</th>
                        </tr>
                    </thead>
                    <tbody id="allhosts-tbody">
                        <tr><td colspan="5">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        var _detailCache = {};
        var _currentChart = null;

        function _formatBytes(b) {
            if (b === 0) return '0 B';
            var k = 1024;
            var sizes = ['B','KB','MB','GB','TB'];
            var i = Math.floor(Math.log(b) / Math.log(k));
            return parseFloat((b / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function _createDetailRow(mac) {
            var row = document.createElement('tr');
            row.className = 'detail-row';
            row.setAttribute('data-mac', mac);
            row.setAttribute('data-expanded', 'false');
            row.style.display = 'none';
            var td = document.createElement('td');
            td.style.padding = '14px 14px 14px 34px';
            row.appendChild(td);
            return row;
        }

        async function _fetchHistory(mac, period) {
            try {
                var res = await fetch('/api/traffic/history?mac=' + mac + '&period=' + period);
                var data = await res.json();
                _detailCache[mac] = data;
                return data;
            } catch (e) {
                console.error('Error fetching history:', e);
                return null;
            }
        }

        function toggleDetail(dev) {
            var mac = dev.mac;
            var det = document.querySelector('.detail-row[data-mac="' + mac + '"]');
            if (!det || det.getAttribute('data-expanded') === 'false') {
                if (!det) {
                    var parentTr = dev._parentTr ||
                        document.querySelector('[data-mac="' + mac + '"]')?.closest('tr');
                    if (!parentTr) return;
                    det = _createDetailRow(mac);
                    var colspan = parentTr.parentNode.querySelectorAll('tr:first-child th, tr:first-child td').length || 5;
                    det.querySelector('td').setAttribute('colspan', colspan);
                    parentTr.parentNode.insertBefore(det, parentTr.nextSibling);
                }
                det.style.display = '';
                det.setAttribute('data-expanded', 'true');
                (async function () {
                    var period = 'day';
                    var data = _detailCache[mac];
                    if (!data) data = await _fetchHistory(mac, period);
                    if (data && data.period) period = data.period;
                    _renderDetail(mac, data || {}, period);
                })();
            } else if (det) {
                det.style.display = 'none';
                det.setAttribute('data-expanded', 'false');
            }
        }

        function _renderDetail(mac, data, period) {
            var det = document.querySelector('.detail-row[data-mac="' + mac + '"]');
            if (!det) return;
            var td = det.querySelector('td');
            td.innerHTML = '';
            var container = document.createElement('div');
            var pillsDiv = document.createElement('div');
            pillsDiv.className = 'period-pills';
            var periods = ['day', 'week', 'month', 'year'];
            for (var pi = 0; pi < periods.length; pi++) {
                (function (p) {
                    var pill = document.createElement('span');
                    pill.className = 'period-pill' + (p === period ? ' active' : '');
                    pill.setAttribute('role', 'button');
                    pill.textContent = p.charAt(0).toUpperCase() + p.slice(1);
                    pill.addEventListener('click', function () {
                        pillsDiv.querySelectorAll('.period-pill').forEach(function (el) { el.classList.remove('active'); });
                        pill.classList.add('active');
                        _detailCache[mac] = null;
                        (async function () {
                            var d = await _fetchHistory(mac, p);
                            if (d) _renderDetail(mac, d, p);
                        })();
                    });
                    pillsDiv.appendChild(pill);
                })(periods[pi]);
            }
            container.appendChild(pillsDiv);
            var statsDiv = document.createElement('div');
            statsDiv.className = 'detail-stats';
            var downL = document.createElement('span');
            downL.innerHTML = '\u2193 <strong>' + _formatBytes(data.total_down || 0) + '</strong>';
            statsDiv.appendChild(downL);
            var upL = document.createElement('span');
            upL.innerHTML = '\u2191 <strong>' + _formatBytes(data.total_up || 0) + '</strong>';
            statsDiv.appendChild(upL);
            var avgD = document.createElement('span');
            avgD.textContent = 'avg ' + _formatBytes(data.avg_down_per_day || 0) + '/day';
            statsDiv.appendChild(avgD);
            var avgU = document.createElement('span');
            avgU.textContent = 'avg ' + _formatBytes(data.avg_up_per_day || 0) + '/day';
            statsDiv.appendChild(avgU);
            container.appendChild(statsDiv);
            var cw = document.createElement('div');
            cw.className = 'chart-container';
            var canvas = document.createElement('canvas');
            cw.appendChild(canvas);
            container.appendChild(cw);
            td.appendChild(container);
            if (_currentChart) { _currentChart.destroy(); _currentChart = null; }
            if (!data.buckets || data.buckets.length === 0) return;
            var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            var labels = data.buckets.map(function (bk) {
                var d = new Date(bk.ts * 1000);
                if (period === 'day') {
                    var h = d.getHours();
                    var m = d.getMinutes();
                    return h + ':' + (m < 10 ? '0' : '') + m;
                }
                return months[d.getMonth()] + ' ' + d.getDate();
            });
            var maxMbps = 0;
            data.buckets.forEach(function (bk) {
                if (bk.down_mbps > maxMbps) maxMbps = bk.down_mbps;
                if (bk.up_mbps > maxMbps) maxMbps = bk.up_mbps;
            });
            _currentChart = new Chart(canvas, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Down',
                            data: data.buckets.map(function (bk) { return bk.down_mbps; }),
                            borderColor: '#1565c0',
                            backgroundColor: 'rgba(21,101,192,0.35)',
                            fill: 'origin',
                            tension: 0.3,
                            pointRadius: 0,
                            borderWidth: 1.5
                        },
                        {
                            label: 'Up',
                            data: data.buckets.map(function (bk) { return -bk.up_mbps; }),
                            borderColor: '#c62828',
                            backgroundColor: 'rgba(198,40,40,0.35)',
                            fill: 'origin',
                            tension: 0.3,
                            pointRadius: 0,
                            borderWidth: 1.5
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false } },
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function (v) {
                                    var av = Math.abs(v);
                                    if (av >= 1) return av.toFixed(1) + ' Mbps';
                                    var kbps = av * 1000;
                                    if (kbps >= 1) return kbps.toFixed(0) + ' kbps';
                                    return (kbps * 1000).toFixed(0) + ' bps';
                                }
                            }
                        }
                    }
                }
            });
        }

        var _batchTraffic = {};
        var _currentPeriod = 'day';
        var _allHostsSort = { col: -1, dir: 'desc' };

        function onPeriodChange() {
            _currentPeriod = document.getElementById('period-select').value;
            fetchBatchTraffic();
        }

        async function fetchBatchTraffic() {
            try {
                var res = await fetch('/api/traffic/batch-history?period=' + _currentPeriod);
                var data = await res.json();
                _batchTraffic = data.macs || {};
                updateTrafficCells();
            } catch (e) {
                console.error('Error fetching batch traffic:', e);
            }
        }

        function updateTrafficCells() {
            document.querySelectorAll('.traffic-down[data-mac]').forEach(function(el) {
                var mac = el.getAttribute('data-mac').toLowerCase();
                var t = _batchTraffic[mac];
                el.textContent = (t && t.down > 0) ? _formatBytes(t.down) : '';
            });
            document.querySelectorAll('.traffic-up[data-mac]').forEach(function(el) {
                var mac = el.getAttribute('data-mac').toLowerCase();
                var t = _batchTraffic[mac];
                el.textContent = (t && t.up > 0) ? _formatBytes(t.up) : '';
            });
            sortAllHosts();
        }

        function sortAllHostsCol(col) {
            if (_allHostsSort.col === col) {
                if (_allHostsSort.dir === 'desc') _allHostsSort.dir = 'asc';
                else { _allHostsSort.col = -1; _allHostsSort.dir = 'desc'; }
            } else {
                _allHostsSort.col = col;
                _allHostsSort.dir = 'desc';
            }
            sortAllHosts();
        }

        function _naturalCompare(a, b) {
            if (a === b) return 0;
            var xA = a.split(/(\d+)/).filter(Boolean);
            var xB = b.split(/(\d+)/).filter(Boolean);
            var len = Math.min(xA.length, xB.length);
            for (var i = 0; i < len; i++) {
                var sA = xA[i], sB = xB[i];
                if (sA === sB) continue;
                var nA = parseInt(sA, 10), nB = parseInt(sB, 10);
                if (!isNaN(nA) && !isNaN(nB)) {
                    if (nA !== nB) return nA - nB;
                }
                return sA < sB ? -1 : 1;
            }
            return xA.length - xB.length;
        }

        function sortAllHosts() {
            var tbody = document.getElementById('allhosts-tbody');
            if (!tbody) return;
            var rows = Array.from(tbody.querySelectorAll('tr.device-row'));
            if (rows.length === 0) return;
            var col = _allHostsSort.col;
            var dir = _allHostsSort.dir;
            rows.sort(function(a, b) {
                var macA = a.querySelector('td:nth-child(3)')?.textContent || '';
                var macB = b.querySelector('td:nth-child(3)')?.textContent || '';
                var aVal, bVal;
                if (col === 0) { aVal = a.querySelector('td:nth-child(1)').textContent; bVal = b.querySelector('td:nth-child(1)').textContent; }
                else if (col === 1) { aVal = a.querySelector('td:nth-child(2)').textContent; bVal = b.querySelector('td:nth-child(2)').textContent; }
                else if (col === 2) { aVal = macA; bVal = macB; }
                else if (col === 3) { aVal = _batchTraffic[macA]?.down || 0; bVal = _batchTraffic[macB]?.down || 0; }
                else if (col === 4) { aVal = _batchTraffic[macA]?.up || 0; bVal = _batchTraffic[macB]?.up || 0; }
                else { aVal = a.querySelector('td:nth-child(1)').textContent; bVal = b.querySelector('td:nth-child(1)').textContent; }
                var cmp = 0;
                if (typeof aVal === 'string') cmp = _naturalCompare(aVal, bVal);
                else cmp = aVal - bVal;
                return dir === 'desc' ? -cmp : cmp;
            });
            rows.forEach(function(row) {
                var det = row.nextSibling;
                tbody.appendChild(row);
                if (det && det.className && det.className.indexOf('detail-row') !== -1) {
                    tbody.appendChild(det);
                }
            });
            var headers = tbody.parentNode.querySelectorAll('.sortable-header');
            var baseLabels = ['Device', 'IP', 'MAC', 'Traffic \u2193', 'Traffic \u2191'];
            headers.forEach(function(th, i) {
                th.textContent = baseLabels[i] || th.textContent;
                if (_allHostsSort.col === i) th.classList.add('active-sort');
                else th.classList.remove('active-sort');
            });
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(function(btn) { btn.classList.remove('active'); });
            document.querySelector('.tab-btn[onclick="switchTab(\'' + tab + '\')"]').classList.add('active');
            document.getElementById('managed-tab').style.display = tab === 'managed' ? '' : 'none';
            document.getElementById('allhosts-tab').style.display = tab === 'allhosts' ? '' : 'none';
        }

        async function fetchAllHosts() {
            try {
                var res = await fetch('/api/all-hosts');
                var hosts = await res.json();
                var tbody = document.getElementById('allhosts-tbody');
                tbody.innerHTML = '';
                if (hosts.length === 0) {
                    var row = document.createElement('tr');
                    var cell = document.createElement('td');
cell.setAttribute('colspan', '5');
                    cell.textContent = 'No hosts found.';
                    row.appendChild(cell);
                    tbody.appendChild(row);
                    return;
                }
                hosts.forEach(function(host) {
                    var tr = document.createElement('tr');
                    tr.className = 'device-row';
                    var nameTd = document.createElement('td');
                    nameTd.className = 'device-name';
                    nameTd.setAttribute('data-mac', host.mac);
                    nameTd.textContent = host.name;
                    tr.appendChild(nameTd);
                    var ipTd = document.createElement('td');
                    ipTd.textContent = host.ip;
                    tr.appendChild(ipTd);
                    var macTd = document.createElement('td');
                    macTd.textContent = host.mac;
                    tr.appendChild(macTd);
                    var downTd = document.createElement('td');
                    downTd.className = 'traffic-down';
                    downTd.setAttribute('data-mac', host.mac);
                    tr.appendChild(downTd);
                    var upTd = document.createElement('td');
                    upTd.className = 'traffic-up';
                    upTd.setAttribute('data-mac', host.mac);
                    tr.appendChild(upTd);
                    tbody.appendChild(tr);
                    nameTd.addEventListener('click', function() {
                        toggleDetail({ mac: host.mac, _parentTr: tr });
                    });
                    _detailCache[host.mac] = _detailCache[host.mac] || null;
                });

                sortAllHosts();
            } catch (e) {
                console.error('Error fetching all hosts:', e);
            }
        }

        async function fetchDevices() {
            const section = document.getElementById('device-list');
            section.setAttribute('aria-busy', 'true');
            
            try {
                const response = await fetch('/api/devices');
                const devices = await response.json();
                const tbody = document.getElementById('devices-tbody');
                tbody.innerHTML = '';

                if (devices.length === 0) {
                    const emptyRow = document.createElement('tr');
                    const emptyCell = document.createElement('td');
                    emptyCell.setAttribute('colspan', '5');
                    emptyCell.textContent = 'No devices found.';
                    emptyRow.appendChild(emptyCell);
                    tbody.appendChild(emptyRow);
                    return;
                }

                const groups = devices.reduce((acc, dev) => {
                    if (!acc[dev.kid]) acc[dev.kid] = [];
                    acc[dev.kid].push(dev);
                    return acc;
                }, {});

                for (const kid in groups) {
                    const kidDevices = groups[kid];
                    const allBlocked = kidDevices.every(d => d.blocked);

                    // Group Header Row (DOM-safe, no innerHTML with user data)
                    const headerRow = document.createElement('tr');
                    headerRow.className = 'group-header';

                    const td1 = document.createElement('td');
                    const h3 = document.createElement('h3');
                    h3.className = 'kid-name';
                    h3.textContent = kid;
                    td1.appendChild(h3);
                    headerRow.appendChild(td1);

                    const td2 = document.createElement('td');
                    td2.setAttribute('colspan', '4');

                    const batchDiv = document.createElement('div');
                    batchDiv.className = 'batch-control';

                    const label = document.createElement('span');
                    label.textContent = 'BLOCK ALL';
                    batchDiv.appendChild(label);

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.setAttribute('role', 'switch');
                    if (allBlocked) checkbox.checked = true;
                    checkbox.addEventListener('change', function () {
                        toggleMultiple(kid, this.checked);
                    });
                    batchDiv.appendChild(checkbox);

                    td2.appendChild(batchDiv);
                    headerRow.appendChild(td2);
                    tbody.appendChild(headerRow);

                    // Device Rows (DOM-safe)
                    kidDevices.forEach(dev => {
                        const tr = document.createElement('tr');
                        tr.className = 'device-row';

                        const nameTd = document.createElement('td');
                        const nameDiv = document.createElement('div');
                        nameDiv.className = 'device-name';
                        nameDiv.textContent = dev.device_name;
                        nameTd.appendChild(nameDiv);

                        const metaDiv = document.createElement('div');
                        metaDiv.className = 'device-meta';
                        metaDiv.textContent = dev.ip + ' | ' + dev.mac;
                        nameTd.appendChild(metaDiv);
                        tr.appendChild(nameTd);

                        const downTd = document.createElement('td');
                        downTd.className = 'traffic-down';
                        downTd.setAttribute('data-mac', dev.mac);
                        tr.appendChild(downTd);

                        const upTd = document.createElement('td');
                        upTd.className = 'traffic-up';
                        upTd.setAttribute('data-mac', dev.mac);
                        tr.appendChild(upTd);

                        const statusTd = document.createElement('td');
                        const statusSpan = document.createElement('span');
                        statusSpan.className = dev.blocked ? 'status-blocked' : 'status-online';
                        statusSpan.textContent = dev.blocked ? 'BLOCKED' : 'ONLINE';
                        statusTd.appendChild(statusSpan);
                        tr.appendChild(statusTd);

                        const actionTd = document.createElement('td');
                        const devCheckbox = document.createElement('input');
                        devCheckbox.type = 'checkbox';
                        devCheckbox.setAttribute('role', 'switch');
                        if (dev.blocked) devCheckbox.checked = true;
                        const macVal = dev.mac;
                        const blockedVal = dev.blocked;
                        devCheckbox.addEventListener('change', function () {
                            toggleDevice(macVal, blockedVal);
                        });
                        actionTd.appendChild(devCheckbox);
                        tr.appendChild(actionTd);
                        tbody.appendChild(tr);
                        nameDiv.addEventListener('click', function () {
                            toggleDetail(Object.assign({}, dev, { _parentTr: tr }));
                        });
                        _detailCache[dev.mac] = _detailCache[dev.mac] || null;
                    });
                }
            } catch (error) {
                console.error('Error:', error);
            } finally {
                updateTrafficCells();
                section.setAttribute('aria-busy', 'false');
            }
        }

        async function toggleDevice(mac, currentlyBlocked) {
            const action = currentlyBlocked ? 'unblock' : 'block';
            try {
                const response = await fetch('/api/toggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mac, action })
                });
                if (response.ok) await fetchDevices();
                else alert('Failed to update status.');
            } catch (e) { console.error(e); }
        }

        async function toggleMultiple(kid, shouldBlock) {
            const action = shouldBlock ? 'block' : 'unblock';
            try {
                const res = await fetch('/api/devices');
                const devices = await res.json();
                const macs = devices.filter(d => d.kid === kid).map(d => d.mac);
                if (macs.length === 0) return;

                const response = await fetch('/api/toggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ macs, action })
                });
                if (response.ok) await fetchDevices();
                else alert('Failed to update group.');
            } catch (e) { console.error(e); }
        }

        function filterDevices() {
            var query = document.getElementById('search-input').value.toLowerCase().trim();

            // Filter Managed tab
            var managedTbody = document.getElementById('devices-tbody');
            if (managedTbody) {
                var groupHeaders = managedTbody.querySelectorAll('tr.group-header');
                groupHeaders.forEach(function(header) {
                    var kid = header.querySelector('.kid-name')?.textContent.toLowerCase() || '';
                    var next = header.nextElementSibling;
                    var groupDeviceRows = [];
                    var groupDetailRows = [];
                    while (next && !next.classList.contains('group-header')) {
                        if (next.classList.contains('device-row')) {
                            groupDeviceRows.push(next);
                            var det = next.nextElementSibling;
                            if (det && det.classList.contains('detail-row')) groupDetailRows.push(det);
                        }
                        next = next.nextElementSibling;
                    }
                    var anyVisible = false;
                    groupDeviceRows.forEach(function(row, i) {
                        var name = row.querySelector('.device-name')?.textContent.toLowerCase() || '';
                        var meta = row.querySelector('.device-meta')?.textContent.toLowerCase() || '';
                        var match = !query || name.includes(query) || meta.includes(query) || kid.includes(query);
                        var det = groupDetailRows[i];
                        var detWasOpen = det && det.getAttribute('data-expanded') === 'true';
                        row.style.display = match ? '' : 'none';
                        if (match) anyVisible = true;
                        if (det) det.style.display = (match && detWasOpen) ? '' : 'none';
                    });
                    header.style.display = (!query || kid.includes(query) || anyVisible) ? '' : 'none';
                });
            }

            // Filter All Hosts tab
            var allhostsTbody = document.getElementById('allhosts-tbody');
            if (allhostsTbody) {
                var rows = allhostsTbody.querySelectorAll('tr.device-row');
                rows.forEach(function(row) {
                    var name = row.querySelector('td:nth-child(1)')?.textContent.toLowerCase() || '';
                    var ip = row.querySelector('td:nth-child(2)')?.textContent.toLowerCase() || '';
                    var mac = row.querySelector('td:nth-child(3)')?.textContent.toLowerCase() || '';
                    var match = !query || name.includes(query) || ip.includes(query) || mac.includes(query);
                    row.style.display = match ? '' : 'none';
                    var det = row.nextElementSibling;
                    if (det && det.classList.contains('detail-row')) {
                        var detWasOpen = det.getAttribute('data-expanded') === 'true';
                        det.style.display = (match && detWasOpen) ? '' : 'none';
                    }
                });
            }
        }

        async function reloadAll() {
            var query = document.getElementById('search-input').value;
            _detailCache = {};
            if (_currentChart) { _currentChart.destroy(); _currentChart = null; }
            document.querySelectorAll('.detail-row').forEach(function(det) {
                det.style.display = 'none';
                det.setAttribute('data-expanded', 'false');
            });
            await fetchDevices();
            await fetchAllHosts();
            await fetchBatchTraffic();
            document.getElementById('search-input').value = query;
            filterDevices();
        }

        fetchDevices();
        fetchAllHosts();
        fetchBatchTraffic();
    </script>
</body>
</html>
